apiVersion: apps/v1
kind: Deployment
metadata: 
  name: uvc-tenant
spec:
  replicas: 1
  selector: 
    matchLabels: 
      app: uvc-tenant
  template:
    metadata:
      labels:
        app: uvc-tenant
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox
          command: ['sh', '-c', 'until nc -z uvc-redis-srv 6379; do echo "Warte auf Redis..."; sleep 2; done;']
        - name: migration
          image: uvc/uvc-tenant
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: password
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: uri
          command: ["pnpm", "--filter", "uvc-tenant", "run", "migrate-up"]
      containers:
        - name: uvc-tenant
          image: uvc/uvc-tenant
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - containerPort: 3002
          #livenessProbe:
          #  httpGet:
          #    path: /health
          #    port: 3002
          #  initialDelaySeconds: 180
          #  periodSeconds: 20
          #  timeoutSeconds: 5
          #readinessProbe:
          #  httpGet:
          #    path: /health
          #    port: 3002
          #  initialDelaySeconds: 90
          #  periodSeconds: 20
          #  timeoutSeconds: 5
          env:
            - name: JWT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-encryption-key
                  key: schluessel
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: password
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-cluster
                  key: uri
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: brevo_key
            - name: ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: mode
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: public_url
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: s3-config
                  key: endpoint_url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-config
                  key: access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-config
                  key: secret_key
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: s3-config
                  key: bucket_name
            - name: NETWORK_KEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: network_key
            - name: SUPPORT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: support_email
---
apiVersion: v1
kind: Service
metadata:
  name: uvc-tenant-srv
spec:
  selector:
    app: uvc-tenant
  ports:
    - name: uvc-tenant
      protocol: TCP
      port: 3002
      targetPort: 3002