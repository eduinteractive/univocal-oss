apiVersion: v1
kind: ConfigMap
metadata:
  name: uvc-etherpad-proxy-headers
data:
  X-Proxy-Path: /etherpad
  X-Forwarded-Prefix: /etherpad
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uvc-etherpad-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-set-headers: default/uvc-etherpad-proxy-headers
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: apps.univocal.local.de
      http:
        paths:
          - path: /etherpad(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: uvc-etherpad-srv
                port:
                  number: 9001
