apiVersion: v1
kind: ConfigMap
metadata:
  name: shibboleth-sp-config
data:
  shibboleth2.xml: |
    <SPConfig xmlns="urn:mace:shibboleth:3.0:native:sp:config"
          xmlns:conf="urn:mace:shibboleth:3.0:native:sp:config"
          clockSkew="180">

      <OutOfProcess logger="shibd.logger">
          <Extensions>
              <Library path="odbc-store.so" fatal="true"/>
          </Extensions>
      </OutOfProcess>

      <UnixListener address="/var/run/shibboleth/shibd.sock"/>

      <StorageService type="Memory" id="mem" cleanupInterval="900"/>

      <SessionCache type="StorageService" StorageService="mem" cacheTimeout="3600"/>

      <ReplayCache StorageService="mem"/>

      <!-- DFN-AAI: pairwise-id + mail, givenName, sn; schacHomeOrganization leitet die App aus pairwise-id ab -->
      <ApplicationDefaults entityID="${SHIB_ENTITY_ID}"
                          REMOTE_USER="pairwise-id">

          <Sessions lifetime="28800"
                    timeout="3600"
                    relayState="ss:mem"
                    checkAddress="false"
                    handlerSSL="false"
                    cookieProps="http"
                    redirectLimit="host">

              <SSO discoveryProtocol="SAMLDS"
                  discoveryURL="${SHIB_DISCOVERY_URL}">
                  SAML2
              </SSO>

              <!-- Enable SP-local logout handler at /Logout (-> /Shibboleth.sso/Logout) -->
              <Logout>SAML2 Local</Logout>

              <Handler type="Status" Location="/Status" acl="127.0.0.1 ::1 10.1.0.1"/>
              <Handler type="Session" Location="/Session" showAttributeValues="true"/>
          </Sessions>

          <Errors supportContact="${SHIB_SUPPORT_CONTACT}"
                  helpLocation="/"/>

          <MetadataProvider type="XML"
                  url="${SHIB_METADATA_URL}"
                  backingFilePath="dfn-aai-test-metadata.xml"
                  reloadInterval="3600"
                  validate="true">
              <MetadataFilter type="Signature"
                              certificate="/etc/shibboleth/credentials/dfn-aai.pem"/>
          </MetadataProvider>

          <AttributeExtractor type="XML" validate="true" reloadChanges="false" path="attribute-map.xml"/>

          <AttributeResolver type="Query" subjectMatch="true"/>

          <AttributeFilter type="XML" validate="true" path="attribute-policy.xml"/>

          <CredentialResolver type="File"
                              key="/etc/shibboleth/credentials/sp-signing-key.pem"
                              certificate="/etc/shibboleth/credentials/sp-signing-cert.pem"/>
      </ApplicationDefaults>

      <SecurityPolicyProvider type="XML" validate="true" path="security-policy.xml"/>

      <ProtocolProvider type="XML" validate="true" reloadChanges="false" path="protocols.xml"/>
    </SPConfig>

  attribute-map.xml: |
    <Attributes xmlns="urn:mace:shibboleth:2.0:attribute-map"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="urn:mace:shibboleth:2.0:attribute-map classpath:/schema/attribute-map.xsd">

      <Attribute name="urn:oid:0.9.2342.19200300.100.1.3" id="mail"/>
      <Attribute name="urn:oid:2.5.4.42" id="givenName"/>
      <Attribute name="urn:oid:2.5.4.4" id="sn"/>
      <Attribute name="urn:oasis:names:tc:SAML:attribute:pairwise-id" id="pairwise-id"/>
    </Attributes>

  attribute-policy.xml: |
    <afp:AttributeFilterPolicyGroup xmlns:afp="urn:mace:shibboleth:2.0:afp"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="urn:mace:shibboleth:2.0:afp classpath:/schema/shibboleth-2.0-afp.xsd">

      <afp:AttributeFilterPolicy id="dfnMinimal">
          <afp:PolicyRequirementRule xsi:type="afp:ANY"/>
          <afp:AttributeRule attributeID="pairwise-id">
              <afp:PermitValueRule xsi:type="afp:ANY"/>
          </afp:AttributeRule>
          <afp:AttributeRule attributeID="givenName">
              <afp:PermitValueRule xsi:type="afp:ANY"/>
          </afp:AttributeRule>
          <afp:AttributeRule attributeID="mail">
              <afp:PermitValueRule xsi:type="afp:ANY"/>
          </afp:AttributeRule>
          <afp:AttributeRule attributeID="sn">
              <afp:PermitValueRule xsi:type="afp:ANY"/>
          </afp:AttributeRule>
      </afp:AttributeFilterPolicy>
    </afp:AttributeFilterPolicyGroup>