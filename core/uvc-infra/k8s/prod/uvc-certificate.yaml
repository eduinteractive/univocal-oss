apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uvc-de-tls
  namespace: default
spec:
  secretName: uvc-de-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: 'apps.univocal.de'
  dnsNames:
    - 'apps.univocal.de'
    - 'univocal.de'