apiVersion: apps/v1
kind: Deployment
metadata:
  name: uvc-shibboleth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uvc-shibboleth
  template:
    metadata:
      labels:
        app: uvc-shibboleth
    spec:
      imagePullSecrets:
        - name: REGISTRY_SECRET_PLACEHOLDER
      containers:
        - name: uvc-shibboleth
          image: REGISTRY_URL_PLACEHOLDER/uvc-shibboleth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shibboleth-config
              mountPath: /etc/shibboleth/shibboleth2.xml
              subPath: shibboleth2.xml
              readOnly: true
            - name: shibboleth-config
              mountPath: /etc/shibboleth/attribute-map.xml
              subPath: attribute-map.xml
              readOnly: true
            - name: shibboleth-config
              mountPath: /etc/shibboleth/attribute-policy.xml
              subPath: attribute-policy.xml
              readOnly: true
            - name: apache-config
              mountPath: /etc/httpd/conf.d/shib-proxy.conf
              subPath: shib-proxy.conf
              readOnly: true
            - name: shibboleth-credentials
              mountPath: /etc/shibboleth/credentials
              readOnly: true
          # "Host: ..." must not be bare YAML (parses as a map). One shell string avoids that.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -S /var/run/shibboleth/shibd.sock && curl -fsS http://127.0.0.1/shibboleth-k8s-probe
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -S /var/run/shibboleth/shibd.sock && curl -fsS http://127.0.0.1/shibboleth-k8s-probe
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: shibboleth-config
          configMap:
            name: shibboleth-sp-config
        - name: apache-config
          configMap:
            name: shibboleth-apache-config
        - name: shibboleth-credentials
          secret:
            secretName: shibboleth-sp-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: uvc-shibboleth-srv
spec:
  selector:
    app: uvc-shibboleth
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80