apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kevin.saukel@saukels.de
    privateKeySecretRef:
      name: letsencrypt-dns
    solvers:
      # Requires the IONOS DNS webhook (github.com/fabmade/cert-manager-webhook-ionos) and the
      # `ionos-dns-secret` in the cert-manager namespace, see Readme.md section 1.7.
      - selector:
          dnsZones:
            - univocal.de
        dns01:
          webhook:
            groupName: acme.fabmade.de
            solverName: ionos
            config:
              apiUrl: https://api.hosting.ionos.com/dns/v1
              publicKeySecretRef:
                name: ionos-dns-secret
                key: IONOS_PUBLIC_PREFIX
              secretKeySecretRef:
                name: ionos-dns-secret
                key: IONOS_SECRET
