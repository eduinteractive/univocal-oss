apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uvc-sites-wildcard-tls
  namespace: default
spec:
  secretName: uvc-sites-wildcard-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    # Wildcards can only be validated via DNS-01, HTTP-01 (letsencrypt-prod) is not sufficient.
    name: letsencrypt-dns
    kind: ClusterIssuer
  commonName: '*.univocal.de'
  dnsNames:
    - '*.univocal.de'
