apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uvc-etherpad-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      proxy_set_header X-Forwarded-Prefix /etherpad;
      sub_filter_once on;
      sub_filter_types text/html;
      sub_filter '</head>' '<style>li[data-key="savedRevision"]{display:none!important}</style></head>';
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apps.univocal.de
      secretName: uvc-de-tls
  rules:
    - host: apps.univocal.de
      http:
        paths:
          - path: /etherpad(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: uvc-etherpad-srv
                port:
                  number: 9001
