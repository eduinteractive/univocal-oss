# Next.js: NEXT_PUBLIC_* is baked in at docker build. Pass the same value as build-arg when building the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uvc-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uvc-landing
  template:
    metadata:
      labels:
        app: uvc-landing
    spec:
      imagePullSecrets:
        - name: REGISTRY_SECRET_PLACEHOLDER
      containers:
        - name: uvc-landing
          image: REGISTRY_URL_PLACEHOLDER/uvc-landing:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 3010
          readinessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: uvc-landing-srv
spec:
  selector:
    app: uvc-landing
  ports:
    - name: uvc-landing
      protocol: TCP
      port: 3010
      targetPort: 3010
